<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - The Student Hub</title>
    <link rel="stylesheet" href="flashcards.css">
</head>
<body>

    <div class="hub-container">
        <!-- Top Navigation -->
        <header class="top-nav">
            <a id="back-to-chapter" href="computer.html" class="back-link">← Back to Chapter</a>
            <h1 id="chapter-title">Loading Chapter...</h1>
            <p id="card-counter" class="card-counter">Card 0 of 0</p>
        </header>

        <!-- Dynamic Progress Bar -->
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <!-- 3D Flashcard Section -->
        <main class="flashcard-section">
            <div class="flashcard-container" onclick="flipCard()">
                <div class="flashcard" id="flashcard">
                    
                    <!-- Front Side -->
                    <div class="card-face card-front">
                        <span class="card-label">QUESTION</span>
                        <div class="card-content">
                            <p id="card-question">Loading question...</p>
                        </div>
                        <span class="click-hint">Click or Space to Flip ↺</span>
                    </div>

                    <!-- Back Side -->
                    <div class="card-face card-back">
                        <span class="card-label">ANSWER</span>
                        <div class="card-content">
                            <p id="card-answer">Loading answer...</p>
                        </div>
                        <span class="click-hint">Click or Space to Flip ↺</span>
                    </div>

                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="prev-btn" class="btn btn-secondary" onclick="prevCard()">Previous</button>
                <button class="btn btn-shuffle" onclick="shuffleCards()">🔀 Shuffle</button>
                <button id="next-btn" class="btn btn-primary" onclick="nextCard()">Next</button>
            </div>
        </main>
    </div>

    <script src="flashcards.js"></script>
</body>
</html>
