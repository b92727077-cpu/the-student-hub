<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Flashcards · The Student Hub</title><link rel="stylesheet" href="flashcards.css"></head>
<body>
<div class="hub-container">
  <header class="top-nav">
    <a id="back-to-chapter" href="chapter.html?subject=computer&chapter=1" class="back-link">← Back to Chapter</a>
    <h1 id="chapter-title">Loading Chapter...</h1>
    <p id="card-counter" class="card-counter">Card 0 of 0</p>
  </header>
  <div class="progress-container" role="progressbar" aria-label="Flashcard progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="progress-bar" class="progress-bar"></div>
  </div>
  <main class="flashcard-section">
    <div class="flashcard-container" onclick="flipCard()" role="button" tabindex="0" aria-label="Flip flashcard">
      <div class="flashcard" id="flashcard">
        <div class="card-face card-front"><span class="card-label">QUESTION</span><div class="card-content"><p id="card-question">Loading question...</p></div><span class="click-hint">Click or press Space to flip</span></div>
        <div class="card-face card-back"><span class="card-label">ANSWER</span><div class="card-content"><p id="card-answer">Loading answer...</p></div><span class="click-hint">Click or press Space to return</span></div>
      </div>
    </div>
    <div class="controls">
      <button id="prev-btn" class="btn btn-secondary" onclick="prevCard()">Previous</button>
      <button class="btn btn-primary flip-button" onclick="flipCard()">Flip</button>
      <button class="btn btn-shuffle" onclick="shuffleCards()">Shuffle</button>
      <button id="next-btn" class="btn btn-primary" onclick="nextCard()">Next</button>
    </div>
  </main>
</div>
<script>
  const requestedSubject = new URLSearchParams(window.location.search).get("subject");
  if (requestedSubject && requestedSubject.toLowerCase() !== "computer") {
    window.location.replace("statistics.html");
  }
</script>
<script src="flashcards.js"></script>
<script src="legacy-shell.js"></script>
</body></html>
