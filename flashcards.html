<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Practice</title>
    <link rel="stylesheet" href="flashcards.css">
</head>
<body>

    <div class="container">
        <!-- Top Navigation -->
        <div class="top-nav">
            <a id="back-to-chapter" href="#" class="back-link">← Back to Chapter</a>
            <h2 id="chapter-title">Loading...</h2>
        </div>

        <!-- Visual Progress Bar -->
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <!-- Card Counter -->
        <div class="counter-text" id="card-counter">Card 1 of --</div>

        <!-- 3D Flashcard -->
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <p class="card-label">QUESTION</p>
                    <h3 id="card-question">Loading Question...</h3>
                    <span class="click-hint">Click or Space to flip ↺</span>
                </div>
                <div class="card-face card-back">
                    <p class="card-label">ANSWER</p>
                    <p id="card-answer">Loading Answer...</p>
                </div>
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="controls">
            <button id="prev-btn" class="btn" onclick="prevCard()">Previous</button>
            <button class="btn btn-shuffle" onclick="shuffleCards()">🔀 Shuffle</button>
            <button id="next-btn" class="btn" onclick="nextCard()">Next</button>
        </div>
    </div>

    <script src="flashcards.js"></script>
</body>
</html>
