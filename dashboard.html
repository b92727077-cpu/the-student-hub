
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Student Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F6F1F4;
            color: #3F3540;
            min-height: 100vh;
        }

        header {
            background: #927487;
            color: white;
            text-align: center;
            padding: 30px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 55px auto;
        }

        .welcome-message {
            text-align: center;
            margin-bottom: 35px;
        }

        .welcome-message h2 {
            color: #6F5665;
            font-size: 30px;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-top: 30px;
        }

        .subject {
            display: block;
            background: #FFFFFF;
            padding: 28px;
            border-radius: 14px;
            text-align: center;
            text-decoration: none;
            color: #6F5665;
            box-shadow: 0 3px 10px rgba(80, 60, 70, 0.08);
            transition: 0.2s ease;
        }

        .subject:hover {
            background: #F3E9EE;
            box-shadow: 0 8px 20px rgba(80, 60, 70, 0.16);
            transform: translateY(-3px);
        }

        .subject h3 {
            font-size: 18px;
        }

        .extra-learning {
            margin-top: 45px;
            background: #E8D9DE;
            padding: 25px;
            border-radius: 15px;
        }

        .extra-learning h2 {
            color: #6F5665;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            color: #6d6478;
        }

        @media (max-width: 800px) {
            .subjects {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .subjects {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<script>
    const name = localStorage.getItem("studentName");

    if (name) {
        document.getElementById("welcome-message").textContent =
            "Welcome, " + name + " 👋!";
    }
</script>
<body>

    <header>
        <h1>The Student Hub</h1>
        <p>Your personal learning space</p>
    </header>

    <main class="container">

        <section class="welcome-message">
            <h2 id="welcome-message"></h2>
        </section>

        <h2>My Subjects</h2>

        <section class="subjects">

            <a href="english.html" class="subject">
                <h3>English</h3>
            </a>

            <a href="urdu.html" class="subject">
                <h3>Urdu</h3>
            </a>

            <a href="mathematics.html" class="subject">
                <h3>Mathematics</h3>
            </a>

            <a href="computer.html" class="subject">
                <h3>Computer Science</h3>
            </a>

            <a href="statistics.html" class="subject">
                <h3>Statistics</h3>
            </a>

            <a href="physics.html" class="subject">
                <h3>Physics</h3>
            </a>

            <a href="tarjuma-tul-quran.html" class="subject">
                <h3>Tarjuma-tul-Quran</h3>
            </a>

            <a href="islamiyat.html" class="subject">
                <h3>Islamiat</h3>
            </a>

     <a href="extra-learning.html" class="extra-learning">
    <h2>🧠 My Extra Learning</h2>
    <p>
        Save and explore topics you are learning outside your school subjects.
    </p>
</a>

    </main>

    <footer>
        <p>© 2026 The Student Hub — Bakhtawar</p>
    </footer>

</body>
</html>
