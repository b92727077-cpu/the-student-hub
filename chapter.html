<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chapter Practice · The Student Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#F6F1F4;color:#3F3540}header{background:#927487;color:white;padding:28px}header h1{margin:0 0 6px}.container{width:90%;max-width:850px;margin:35px auto}.back{display:inline-block;margin-bottom:22px;color:#6F5665;text-decoration:none;font-weight:bold}.practice-card{display:block;padding:26px;background:white;border-radius:16px;color:#6F5665;text-decoration:none;box-shadow:0 3px 10px rgba(80,60,70,.08);transition:.2s ease}.practice-card:hover{background:#F3E9EE;transform:translateY(-2px)}.notice{background:white;border:1px solid #E6DCE2;border-radius:16px;padding:22px}.notice h2{color:#6F5665}@media(max-width:600px){.container{width:calc(100% - 28px);margin:22px auto}header{padding:22px 18px}}
</style></head><body>
<header><h1 id="subject-heading">Chapter Practice</h1><p>The Student Hub</p></header>
<main class="container"><a id="back-link" class="back" href="computer.html">← Back to Computer Science</a>
<section class="notice"><h2 id="chapter-title">Loading chapter...</h2><p id="chapter-description">Checking available learning content.</p></section>
<a id="practice-link" class="practice-card" href="flashcards.html?subject=computer&chapter=1" hidden><h2>Practice flashcards →</h2><p>Open the available flashcards for this chapter.</p></a>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const subject = (params.get('subject') || 'computer').toLowerCase();
  const chapter = params.get('chapter') || '1';
  const title = document.getElementById('chapter-title');
  const desc = document.getElementById('chapter-description');
  const heading = document.getElementById('subject-heading');
  const back = document.getElementById('back-link');
  const practice = document.getElementById('practice-link');
  if (subject === 'computer' && chapter === '1') {
    heading.textContent = 'Computer Science';
    title.textContent = '1_ Introduction to Software Development';
    desc.textContent = 'Flashcards are available for this chapter.';
    back.href = 'computer.html';
    back.textContent = '← Back to Computer Science';
    practice.hidden = false;
  } else if (subject === 'statistics') {
    heading.textContent = 'Statistics';
    title.textContent = 'Statistics practice is not connected yet';
    desc.textContent = 'This chapter is not linked to Computer Science content. Statistics flashcards will be enabled after the correct subject data is added.';
    back.href = 'statistics.html';
    back.textContent = '← Back to Statistics';
  } else {
    heading.textContent = 'Computer Science';
    title.textContent = 'Chapter content not available yet';
    desc.textContent = 'Currently, only Computer Science Chapter 1 has connected flashcards.';
    back.href = 'computer.html';
    back.textContent = '← Back to Computer Science';
  }
});
</script>
<script src="legacy-shell.js"></script>
</body></html>
